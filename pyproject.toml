[project]
name = "nepse-mcp"
version = "0.1.0"
description = "NEPSE (Nepal Stock Exchange) market data MCP server wrapping the NepaliPaisa API"
readme = "README.md"
authors = [
    { name = "ajaysubedi2002", email = "120254301+ajaysubedi2002@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nepse-mcp = "nepse_mcp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
